version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: antihack-postgres
    restart: always
    environment:
      POSTGRES_USER: antihack_user
      POSTGRES_PASSWORD: antihack_secure_password
      POSTGRES_DB: antihack_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antihack_user -d antihack_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: antihack-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://antihack_user:antihack_secure_password@postgres:5432/antihack_db
      - JWT_SECRET_KEY=super_secret_antihack_jwt_key_2026_change_in_production
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: antihack-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
